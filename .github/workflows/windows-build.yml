name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/desktop-sqlite-schema
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/**'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSVC compiler environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies
        env:
          GYP_MSVS_VERSION: '2022'
        run: npm ci

      - name: Generate Prisma Client
        run: |
          npm run --workspace=@timebridge/database build
          npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Run Automated Tests
        run: npm run test

      - name: Build Application (Frontend & Backend)
        run: npm run build:all

      - name: Build Windows Installer (NSIS)
        run: npm run --workspace=@timebridge/desktop dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeBridge-Windows-Installer
          path: apps/desktop/release/*.exe
